# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Deploy the complete StayNearby stack on Render's Free Tier
# ==============================================================================

services:
  # Option A: Unified Docker Web Service (Frontend + Backend + ML in 1 Service)
  - type: web
    name: staynearby-app
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: staynearby-postgres
          property: connectionString
      - key: MLFLOW_TRACKING_URI
        value: sqlite:///mlflow.db

databases:
  # Built-in Free PostgreSQL database on Render (Zero external service required)
  - name: staynearby-postgres
    databaseName: staynearby
    user: staynearby_admin
    plan: free
    region: oregon
